name: goldfx-scan

on:
  schedule:
    # default cadence. NOTE: this cadence is sustainable ONLY on a public repo
    # (public repos get UNLIMITED Actions minutes). For a private repo change to
    # e.g. '0 * * * *' (hourly) to stay inside the 2,000-min free budget.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: goldfx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements-gha.txt

      - name: Require secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          [ -n "$BOT_TOKEN" ] || { echo "!! BOT_TOKEN repository secret is missing"; exit 1; }
          [ -n "$CHAT_ID" ] || { echo "!! CHAT_ID repository secret is missing"; exit 1; }
          echo "secrets present"

      - name: Scan + deliver
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scripts/gha_scan.py

      - name: Commit state back to the repo
        run: |
          git config user.name "goldfx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add gha_state/
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "no state change - nothing to commit"
          fi

      - name: Keep the bot alive (self-dispatch in ~12 min)
        # GitHub's `schedule` trigger can be delayed for hours, so each run
        # re-dispatches itself after a short sleep instead. This makes the bot
        # self-sustaining cadence ~13 min even when the cron is stalled.
        # Requires the CRON_PAT secret (fine-grained PAT, "Actions" read+write).
        if: always()
        env:
          CRON_PAT: ${{ secrets.CRON_PAT }}
        run: |
          if [ -z "$CRON_PAT" ]; then
            echo "!! CRON_PAT secret missing - relying on schedule trigger only"
            exit 0
          fi
          sleep 720
          code=$(curl -s -o /tmp/dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scanner.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME:-main}\"}")
          echo "self-dispatch HTTP $code"
          [ "$code" = "204" ] || { echo "!! self-dispatch failed"; cat /tmp/dispatch.json; exit 1; }